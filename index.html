<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5757">
<title>ระบบคลินิก Dr.tan · Jungbin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* ===== สีตามแบรนด์ — ค่าเริ่มต้น = Dr.tan (เขียวหัวเป็ดเข้ม ตามโลโก้) · data-brand="jungbin" = ม่วงลาเวนเดอร์-ชมพู ===== */
:root{
  --bg:#f3f6f5;--surface:#ffffff;--surface2:#eaf0ef;--line:#dbe5e3;--ink:#14201f;--ink2:#4f6260;--ink3:#869794;
  --accent:#0e5757;--accent-ink:#ffffff;--accent-soft:#dcecea;--accent-grad:linear-gradient(120deg,#11605f,#0d3d3d);--accent2:#b0884f;
  --warn:#a86b12;--warn-soft:#fbf0dc;--bad:#b23a3a;--bad-soft:#f8e1df;--good:#2f7d4f;--good-soft:#e0f0e5;--info:#2c5d8f;--info-soft:#e1ebf6;
  --shadow:0 1px 2px rgba(10,40,40,.05),0 4px 14px rgba(10,40,40,.06);--r:14px;
  --c1:#0e5757;--c2:#c08a4a;--c3:#5b6bb8;--c4:#a8487a;
}
:root[data-brand="jungbin"]{
  --bg:#faf7fb;--surface:#ffffff;--surface2:#f3edf5;--line:#e9dfee;--ink:#2a2330;--ink2:#6a5f72;--ink3:#9a8fa2;
  --accent:#8b64a0;--accent-ink:#ffffff;--accent-soft:#f1e6f5;--accent-grad:linear-gradient(115deg,#a97cb8,#7f5a96);--accent2:#c2709d;
  --shadow:0 1px 2px rgba(60,30,70,.05),0 4px 14px rgba(60,30,70,.07);
  --c1:#8b64a0;--c2:#d08bb0;--c3:#6f86c6;--c4:#c9a24f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514;--surface:#172020;--surface2:#1f2a29;--line:#2c3a38;--ink:#e5eeec;--ink2:#a7b8b5;--ink3:#74868a;
    --accent:#6cc5ba;--accent-ink:#062320;--accent-soft:#173734;--accent-grad:linear-gradient(120deg,#7fd3c8,#4fa79d);--accent2:#e0b26f;
    --warn:#e3b05c;--warn-soft:#3a2f1a;--bad:#ec8079;--bad-soft:#3d2120;--good:#6fc790;--good-soft:#1b3424;--info:#86b4e6;--info-soft:#1b2c3f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--c1:#6cc5ba;--c2:#e0b26f;--c3:#97a6f0;--c4:#e08bb8;color-scheme:dark}
  :root[data-brand="jungbin"]:not([data-theme="light"]){
    --bg:#151118;--surface:#1e1823;--surface2:#28202e;--line:#3a3042;--ink:#efe8f2;--ink2:#bcaec4;--ink3:#8d8096;
    --accent:#d2acdf;--accent-ink:#2a1a33;--accent-soft:#352840;--accent-grad:linear-gradient(115deg,#e3c1ea,#c49ad4);--accent2:#e8a6c8;
    --c1:#d2acdf;--c2:#e8a6c8;--c3:#9fb2ec;--c4:#e2c47f}
}
:root[data-theme="dark"]{
  --bg:#0f1514;--surface:#172020;--surface2:#1f2a29;--line:#2c3a38;--ink:#e5eeec;--ink2:#a7b8b5;--ink3:#74868a;
  --accent:#6cc5ba;--accent-ink:#062320;--accent-soft:#173734;--accent-grad:linear-gradient(120deg,#7fd3c8,#4fa79d);--accent2:#e0b26f;
  --warn:#e3b05c;--warn-soft:#3a2f1a;--bad:#ec8079;--bad-soft:#3d2120;--good:#6fc790;--good-soft:#1b3424;--info:#86b4e6;--info-soft:#1b2c3f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--c1:#6cc5ba;--c2:#e0b26f;--c3:#97a6f0;--c4:#e08bb8;color-scheme:dark}
:root[data-brand="jungbin"][data-theme="dark"]{
  --bg:#151118;--surface:#1e1823;--surface2:#28202e;--line:#3a3042;--ink:#efe8f2;--ink2:#bcaec4;--ink3:#8d8096;
  --accent:#d2acdf;--accent-ink:#2a1a33;--accent-soft:#352840;--accent-grad:linear-gradient(115deg,#e3c1ea,#c49ad4);--accent2:#e8a6c8;
  --c1:#d2acdf;--c2:#e8a6c8;--c3:#9fb2ec;--c4:#e2c47f}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;margin:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.hd{font-family:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.6rem .75rem;width:100%;min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--ink2);min-width:0}
label.ck{flex-direction:row;align-items:flex-start;gap:.6rem;font-size:.95rem;color:var(--ink);cursor:pointer}
label.ck input{width:22px;min-height:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 90px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding-block:.55rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .ttl{flex:1;min-width:0;font-family:"Bai Jamjuree",sans-serif;font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:.8rem;color:var(--ink2);text-align:right;line-height:1.25}
.brand-dot{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:"Bai Jamjuree";flex:none;font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.6rem 1rem;min-height:46px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent-grad);border-color:transparent;color:var(--accent-ink)}
.btn.w{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.d{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.g{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.q{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{min-height:36px;padding:.3rem .7rem;font-size:.88rem;border-radius:10px}
.btn.lg{min-height:58px;font-size:1.08rem;padding:.8rem 1.4rem}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:.75rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.sp{flex:1}
.grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g2{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{display:grid;gap:.75rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;gap:1rem;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}h1{font-size:1.35rem}}
.muted{color:var(--ink2)}.small{font-size:.85rem}.xs{font-size:.76rem}.b{font-weight:600}.r{text-align:right}.mono{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;font-family:"Bai Jamjuree",sans-serif;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:99px;padding:.12rem .6rem;font-size:.78rem;font-weight:500;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.a{background:var(--accent-soft);color:var(--accent)}.pill.w{background:var(--warn-soft);color:var(--warn)}.pill.d{background:var(--bad-soft);color:var(--bad)}.pill.g{background:var(--good-soft);color:var(--good)}.pill.i{background:var(--info-soft);color:var(--info)}
.allergy{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:.4rem .7rem;font-weight:600}
.tile{display:flex;flex-direction:column;gap:.35rem;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem;min-height:120px;cursor:pointer;box-shadow:var(--shadow);position:relative}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:24px;height:24px}
.tile b{font-family:"Bai Jamjuree";font-size:1.08rem}
.tile .badge{position:absolute;top:.8rem;right:.8rem;background:var(--accent2);color:var(--surface);border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:.9rem;padding:0 .5rem}
.tile.hero{background:var(--accent-grad);color:var(--accent-ink);border-color:transparent}
.tile.hero .ic{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);color:var(--accent-ink)}
.tile.hero .muted{color:inherit;opacity:.85}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:.75rem;align-items:center;padding:.75rem .2rem;border-bottom:1px solid var(--line);min-width:0;cursor:default}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}.li.tap:hover{background:var(--surface2)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:.85rem;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.qn{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"Bai Jamjuree";font-weight:700;font-size:1.15rem;flex:none}
.tabs{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:none}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:.45rem .95rem;cursor:pointer;white-space:nowrap;min-height:40px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prod{display:grid;gap:.55rem;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.prod button{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.7rem .75rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;min-height:86px}
.prod button:active{border-color:var(--accent)}
.prod button .pr{margin-top:auto;font-family:"Bai Jamjuree";font-weight:600;color:var(--accent)}
.prod button.promo{background:var(--warn-soft);border-color:transparent}
.cart .li{align-items:flex-start}
.qty{display:flex;align-items:center;gap:.2rem}
.qty button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.qty span{min-width:26px;text-align:center}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-family:"Bai Jamjuree";font-size:1.5rem;font-weight:700}
.kpi{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi .card{padding:.85rem 1rem}
.kpi .v{font-family:"Bai Jamjuree";font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:.8rem;color:var(--ink2)}
.up{color:var(--good)}.dn{color:var(--bad)}
.tbl{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:.8rem;background:var(--surface2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:330px;margin:0 auto}
.pin button{height:68px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:1.5rem;font-family:"Bai Jamjuree";cursor:pointer}
.dots{display:flex;gap:.7rem;justify-content:center;margin:1rem 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink3)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.sig{border:1.5px dashed var(--ink3);border-radius:12px;background:var(--surface);touch-action:none;width:100%;height:170px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.5rem .85rem;cursor:pointer;min-height:44px;text-align:left}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips button.busy{opacity:.5}
.board{display:grid;gap:.8rem;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--surface2);border-radius:16px;padding:.6rem;display:flex;flex-direction:column;gap:.55rem;min-height:140px;min-width:0}
.col h3{font-size:.95rem;padding:.2rem .3rem;display:flex;justify-content:space-between}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem;cursor:pointer;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.qc.due{border:2px solid var(--bad);background:var(--bad-soft)}
.qc .nm{font-weight:600;display:flex;gap:.4rem;align-items:center}
.timer{font-family:"Bai Jamjuree";font-weight:700;font-variant-numeric:tabular-nums}
.sched{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:72vh}
.sched .gridt{display:grid;position:relative}
.sched .hdr{position:sticky;top:0;z-index:3;background:var(--surface2);font-size:.78rem;font-weight:600;padding:.45rem .4rem;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;line-height:1.2}
.sched .tm{position:sticky;left:0;z-index:2;background:var(--surface);font-size:.72rem;color:var(--ink3);padding-right:.35rem;text-align:right;border-top:1px solid var(--line)}
.sched .cell{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sched .cell.hr{border-top-color:var(--ink3)}
.sched .ap{position:absolute;border-radius:9px;padding:.25rem .4rem;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:pointer;background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent);z-index:1}
.sched .ap.c{background:var(--info-soft);border-left-color:var(--info)}
.sched .ap.ARRIVED{background:var(--good-soft);border-left-color:var(--good)}
.sched .ap.NOSHOW{background:var(--surface2);border-left-color:var(--ink3);opacity:.7;text-decoration:line-through}
.sched .ap.ipd{background:var(--warn-soft);border-left-color:var(--warn)}
.sched .now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}
.slots{display:grid;gap:.45rem;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.slots button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.45rem;cursor:pointer;text-align:center;line-height:1.25}
.slots button.on{border-color:var(--accent);background:var(--accent-soft)}
.slots button b{font-family:"Bai Jamjuree";font-size:1.05rem}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.bar{display:flex;align-items:center;gap:.5rem;font-size:.86rem}
.bar .tr{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:40px}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sec{display:flex;align-items:center;gap:.6rem;margin:.4rem 0 .1rem}
.sec h2{flex:1}
.note{background:var(--info-soft);color:var(--info);border-radius:12px;padding:.7rem .9rem;font-size:.9rem}
.note.w{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;color:var(--ink3);padding:1.6rem .5rem;font-size:.92rem}
.photo{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.photo figure{margin:0;position:relative}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;max-width:100%}
.photo figcaption{font-size:.72rem;color:var(--ink2)}
.idimg{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.receipt{font-variant-numeric:tabular-nums}
.receipt .li{padding:.4rem 0}
/* overlay/dialog */
#busy{position:fixed;inset:0;z-index:90;background:rgba(10,20,18,.32);display:grid;place-items:center;backdrop-filter:blur(1.5px)}
#busy .box{background:var(--surface);border-radius:18px;padding:1.2rem 1.6rem;display:flex;align-items:center;gap:.9rem;box-shadow:var(--shadow);font-weight:600}
.spin{width:30px;height:30px;border-radius:50%;border:3.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
.spin.sm{width:18px;height:18px;border-width:2.5px}
@keyframes sp{to{transform:rotate(360deg)}}
#dlg{position:fixed;inset:0;z-index:80;background:rgba(10,20,18,.42);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){#dlg{align-items:center}}
#dlg .box{background:var(--bg);border-radius:20px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.8rem;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#dlg .box.wide{width:min(900px,100%)}
#dlg .acts{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-1.1rem;background:var(--bg);padding-block:.6rem;margin-bottom:-.6rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:.4rem;align-items:center;width:min(560px,calc(100% - 32px))}
#toast div{background:var(--ink);color:var(--bg);border-radius:12px;padding:.65rem 1rem;font-size:.95rem;box-shadow:var(--shadow);animation:tin .2s}
#toast div.e{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.demo-banner{background:var(--warn-soft);color:var(--warn);font-size:.8rem;text-align:center;padding:.3rem 1rem}
.login-hero{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:1.2rem;max-width:760px;margin:0 auto}
.brcards{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.brcards{grid-template-columns:1fr}}
.brcards button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:1.1rem;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;min-height:96px;box-shadow:var(--shadow)}
.brcards button b{font-family:"Bai Jamjuree";font-size:1.15rem}
.demo-pins{font-size:.8rem;color:var(--ink2);display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.2rem .8rem}
.demo-pins button{all:unset;cursor:pointer;padding:.15rem 0}
.demo-pins button b{color:var(--accent);font-family:"Bai Jamjuree";margin-right:.35rem}
.hide-sm{}
@media (max-width:620px){.hide-sm{display:none!important}}

/* โลโก้ (mask — ระบายสีตามธีม) */
.logo{display:inline-block;flex:none;background:linear-gradient(160deg,#106262,#0f3f3f 65%,#132626);-webkit-mask:var(--lm) center/contain no-repeat;mask:var(--lm) center/contain no-repeat}
.logo.jb{background:linear-gradient(90deg,#e8c3db,#b993c8)}
.logo.mk{width:34px;height:34px}
.logo.full{width:150px;height:170px}
.logo.jb.full{width:150px;height:150px}
.brcards button{position:relative;overflow:hidden;flex-direction:row;align-items:center;gap:.9rem}
.brcards button .t{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.brcards button.jb{border-color:color-mix(in srgb,#b993c8 35%,var(--line))}
.brcards button.jb:hover,.brcards button.jb:focus-visible{border-color:#b993c8}
.brcards button .logo{width:52px;height:52px}
.brand-pair{display:flex;gap:1.1rem;align-items:center}
.brand-pair .logo.mk{width:46px;height:46px}
.rc-logo{display:flex;justify-content:center}
.rc-logo .logo.full{width:120px;height:136px}.rc-logo .logo.jb.full{width:110px;height:110px}
.mailprev{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.dt{background:linear-gradient(160deg,#8ad8cd,#4fa79d)}}
:root[data-theme="dark"] .logo.dt{background:linear-gradient(160deg,#8ad8cd,#4fa79d)}
.li.cs{flex-wrap:wrap}.li.cs .main{flex:1 1 220px}.li.cs .bx{display:flex;gap:.5rem;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.li.cs .bx{width:100%}}
.vin{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.hx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem}
.hx-i{border-radius:12px;padding:.55rem .75rem;display:flex;flex-direction:column;gap:.1rem;border:1.5px solid var(--line);background:var(--surface2)}
.hx-i span{font-size:.75rem;color:var(--ink2)}.hx-i b{font-size:1.02rem;line-height:1.3}
.hx-i.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}.hx-i.bad span{color:var(--bad)}
.hx-i.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}.hx-i.warn span{color:var(--warn)}
.hx-i.ok b{color:var(--good)}
.vt{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.vt>div{background:var(--accent-soft);border-radius:12px;padding:.45rem .8rem;display:flex;align-items:baseline;gap:.35rem}
.vt>div span{font-size:.75rem;color:var(--ink2);font-weight:600}.vt>div b{font-family:"Bai Jamjuree",sans-serif;font-size:1.35rem;font-variant-numeric:tabular-nums}.vt>div i{font-style:normal;font-size:.75rem;color:var(--ink3)}
.vt>div.bad{background:var(--bad-soft)}.vt>div.bad b{color:var(--bad)}
.vt p{margin:0;flex-basis:100%}
.note.d{background:var(--bad-soft);color:var(--bad)}
.hx-i.ask b{color:var(--ink3);font-weight:500}
/* ใบเสร็จความร้อน */
#printArea{display:none}
.slip{font-family:"Sarabun","IBM Plex Sans Thai",Tahoma,sans-serif;color:#000;background:#fff;font-size:12px;line-height:1.35;padding:2mm 0}
.slip.p80{width:72mm}.slip.p58{width:48mm;font-size:11px}
.slip .sl-c{text-align:center}.slip .sl-logo{width:30mm;max-width:60%;height:auto;filter:grayscale(1) brightness(0);margin:0 auto 1mm;display:block}
.slip.p58 .sl-logo{width:22mm}
.slip .sl-b{font-weight:700;font-size:1.15em}.slip .sl-s{font-size:.92em}.slip .sl-t{font-weight:700;margin:1.5mm 0 1mm;font-size:1.1em;letter-spacing:.03em}
.slip .sl-r{display:flex;justify-content:space-between;gap:2mm}.slip .sl-r span:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.slip .sl-i{margin-top:1mm}.slip .sl-big{font-weight:700;font-size:1.3em;margin:1mm 0}
.slip .sl-hr{border-top:1px dashed #000;margin:1.5mm 0}
.slip-prev{display:flex;justify-content:center;background:#e9e9e9;padding:12px;border-radius:10px;max-height:65vh;overflow:auto}
.slip-prev .slip{padding:3mm;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media print{
  @page{margin:0}
  body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{display:block!important;position:absolute;left:0;top:0}
  body{background:#fff!important}
}

/* Beam QR */
.bq-img{width:min(300px,72vw);aspect-ratio:1;max-width:100%;display:block;border-radius:12px;background:#fff;padding:6px}
.bq-img svg{width:100%;height:100%;display:block}
.bq-url{font-size:.75rem;word-break:break-all;max-width:100%}
.bq-amt{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.prod .addnew{border:1.5px dashed var(--line,#c9d6d4);background:transparent}

</style>

  function e164(p) { var d = String(p || '').replace(/[^\d+]/g, ''); if (!d) return ''; if (d[0] === '+') return d; if (d.indexOf('66') === 0 && d.length === 11) return '+' + d; if (d[0] === '0') return '+66' + d.slice(1); return '+' + d; }

    rows('Staff').filter(function (s) { return String(s.lineId) === prof.sub && s !== st; }).forEach(function (s) { upd('Staff', s, { lineId: '', lineName: '' }); });

  /* ---------- ข้อมูลตั้งต้นต่อสาขา ---------- */

  /* ---------- คนไข้ ---------- */

    var rs = roomsOf(b, need.type); if (!rs.length) rs = roomsOf(b, '').filter(function (r) { return r.type !== 'ห้องตรวจ' && r.type !== 'ห้อง IPD'; });

    for (var t = open; t + need.consult + need.dur <= close; t += 15) {

      if (need.consult) { cr = crs.filter(function (r) { return free(m, r.name, t, t + need.consult); })[0]; if (!cr) continue; }

        ipdRoom: ir ? ir.name : '', ipdEnd: ir ? fromMin(e + need.ipd) : '' });

function call(action, p, opt) {

  } else {
    var body = { fn: 'api', token: S.token, action: action, p: p || {}, rid: id };

    run = post(body).catch(function () { return new Promise(function (r) { setTimeout(r, 1200); }).then(function () { return post(body); }); })
      .catch(function () { return { ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่' }; });
  }

}

function dialog(o) {
  return new Promise(function (resolve) {
    var root = $('#dlg'); S.dlg++;
    root.innerHTML = '<div class="box' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true"><div class="row"><h2 class="sp">' + esc(o.title || '') + '</h2>' +
      '<button class="btn q sm" data-x="close" aria-label="ปิด">✕</button></div><div class="body stack">' + (o.body || '') + '</div><div class="err allergy" hidden></div>' +
      '<div class="acts">' + (o.cancel === false ? '' : '<button class="btn" data-x="close">' + esc(o.cancel || 'ยกเลิก') + '</button>') +

    root.hidden = false;
    var box = root.firstChild;
    function close(v) { root.hidden = true; root.innerHTML = ''; S.dlg--; resolve(v); }
    box.close = close;
    root.onclick = function (e) {
      var x = e.target.closest('[data-x]');
      if (e.target === root) return; // กันแตะข้างนอกแล้วหาย
      if (!x) return;

        Promise.resolve().then(function () { return o.onOk ? o.onOk(box) : true; }).then(function (v) { if (v !== false) close(v === undefined ? true : v); })
          .catch(function (e2) { if (e2 && e2.message === 'BUSY') return; er.textContent = e2.message || e2; er.hidden = false; });
      }
    };
    if (o.mount) o.mount(box);
    var f = box.querySelector('input:not([type=checkbox]):not([type=file]),textarea'); if (f && !o.noFocus) setTimeout(function () { f.focus(); }, 60);
  });
}

function sigPad(cv) {
  var ctx = cv.getContext('2d'), drawn = false, last = null;
  function fit() { var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a2a6c'; }
  fit();
  function pt(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', function (e) { cv.setPointerCapture(e.pointerId); last = pt(e); });
  cv.addEventListener('pointermove', function (e) { if (!last) return; var p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; drawn = true; });
  cv.addEventListener('pointerup', function () { last = null; });
  return { get: function () { if (!drawn) return ''; var c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(cv, 0, 0); return c.toDataURL('image/jpeg', .7); },
    clear: function () { ctx.clearRect(0, 0, cv.width, cv.height); drawn = false; } };
}
function sigBlock(id, label) { return '<div class="stack" style="gap:.3rem"><div class="row"><span class="small muted sp">' + esc(label) + '</span><button type="button" class="btn q sm" data-clear="' + id + '">ล้าง</button></div><canvas class="sig" id="' + id + '"></canvas></div>'; }
function mountSigs(root) { var pads = {}; $$('canvas.sig', root).forEach(function (c) { pads[c.id] = sigPad(c); }); $$('[data-clear]', root).forEach(function (b) { b.onclick = function () { pads[b.dataset.clear].clear(); }; }); return pads; }

function readImg(file, max, q) {
  return new Promise(function (res, rej) {
    if (!file) return res('');
    var fr = new FileReader(); fr.onerror = function () { rej(new Error('อ่านรูปไม่ได้')); };
    fr.onload = function () { var im = new Image(); im.onload = function () { var s = Math.min(1, (max || 1280) / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q || .8)); }; im.onerror = function () { rej(new Error('ไฟล์นี้ไม่ใช่รูป')); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  var x = src || { name: '', prices: {}, start: t, end: addDays(m0, -1), parts: [{ part: '', item: '', qty: 1, fullPrice: '', free: false, choice: '' }] };
  if (copy) { x.code = ''; x.name = x.name + ' (ใหม่)'; x.start = t; x.end = addDays(m0, -1); }
  var its = S.boot.items;
  function rowsHtml() { return x.parts.map(function (p, i) { return '<div class="card flat stack" style="padding:.6rem;gap:.4rem" data-pi="' + i + '"><div class="row"><select data-k="item" style="flex:1 1 200px">' + opts(its.map(function (it) { return [it.code, it.name + ' (' + fm(it.price) + ')']; }), p.item, '— เลือกรายการ (หรือพิมพ์ชื่อเองด้านล่าง) —') + '</select><button type="button" class="btn q sm" data-del="' + i + '">✕</button></div>' +
    '<div class="g3"><label>ชื่อในชุด<input data-k="part" value="' + esc(p.part) + '"></label><label>จำนวน<input data-k="qty" type="number" value="' + (p.qty || 1) + '"></label><label>ราคาเต็ม (ใช้แบ่ง DF)<input data-k="fullPrice" type="number" value="' + (p.fullPrice || '') + '"></label></div>' +
    '<div class="row"><label class="ck"><input type="checkbox" data-k="free"' + (p.free ? ' checked' : '') + '> ของแถม</label><input data-k="choice" class="sp" placeholder="ตัวเลือกให้ลูกค้าเลือก เช่น กราม / หน้าผาก" value="' + esc(p.choice || '') + '"></div></div>'; }).join(''); }
  dialog({ title: src && !copy ? 'แก้โปร ' + x.code : 'สร้างโปรใหม่', ok: 'บันทึกโปร', wide: true,
    body: '<label>ชื่อโปร (โชว์บนปุ่มขาย)<input id="pn" value="' + esc(x.name) + '" placeholder="เช่น Pro Size S · พ.ย. 69"></label>' +
      '<div class="g2"><label>วันเริ่ม<input id="ps" type="date" value="' + x.start + '"></label><label>วันหมด<input id="pe" type="date" value="' + x.end + '"></label></div>' +
      '<div class="small b">ราคาแต่ละสาขา (เว้นว่าง = ไม่ขายที่สาขานั้น)</div><div class="g2">' + BRS.map(function (b) { return '<label>' + b[1] + '<input data-br="' + b[0] + '" type="number" inputmode="decimal" value="' + (x.prices[b[0]] || '') + '"></label>'; }).join('') + '</div>' +
      '<div class="small b">ของในชุด</div><div id="pp" class="stack" style="gap:.5rem"></div><button type="button" class="btn sm" id="pa">+ เพิ่มของในชุด</button>' +
      '<p class="xs muted">ระบบแบ่งราคาโปรตามราคาเต็มของแต่ละอย่าง (รวมของแถม) เพื่อคิด DF ต่อครั้งให้ถูก · ขายแล้วเปิดเป็นคอร์สให้อัตโนมัติ</p>',
    mount: function (b) {
      var w = b.querySelector('#pp'); function draw() { w.innerHTML = rowsHtml(); } draw();
      b.querySelector('#pa').onclick = function () { x.parts.push({ part: '', item: '', qty: 1, fullPrice: '', free: false, choice: '' }); draw(); };
      w.onclick = function (e) { var d = e.target.closest('[data-del]'); if (d) { x.parts.splice(+d.dataset.del, 1); draw(); } };
      w.onchange = function (e) { var r = e.target.closest('[data-pi]'), k = e.target.dataset.k; if (!r || !k) return; var p = x.parts[+r.dataset.pi];
        p[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
        if (k === 'item') { var it = its.filter(function (z) { return z.code === p.item; })[0]; if (it) { p.part = p.part || it.name; p.fullPrice = p.fullPrice || it.price; draw(); } } };
    },
    onOk: function (b) {
      var pr = {}; $$('[data-br]', b).forEach(function (i) { if (nz(i.value) > 0) pr[i.dataset.br] = nz(i.value); });
      return call('promoSave', { code: src && !copy ? x.code : '', name: b.querySelector('#pn').value, start: b.querySelector('#ps').value, end: b.querySelector('#pe').value, prices: pr,
        parts: x.parts.map(function (p) { return { item: p.item, part: p.part, qty: nz(p.qty) || 1, fullPrice: nz(p.fullPrice), free: !!p.free, choice: p.choice }; }) }, { write: true })
        .then(function (code) { toast('บันทึกโปร ' + code); call('boot').then(function (bb) { S.boot = bb; }); refresh(); });
    } });
};

/* ---------- รายการที่หน้าร้านเพิ่มเอง (บัญชีตรวจ) ---------- */
TITLES.newItems = 'รายการขายที่หน้าร้านเพิ่มเอง';
SCR.newItems = function () {
  return call('newItems').then(function (ls) {
    S.v.ni = ls;
    return '<div class="stack"><div class="note small">หน้าร้านเพิ่มแล้วขายได้ทันที · ระบบใส่ DF/ค่ามือตามรายการอื่นในหมวดเดียวกันไว้ให้ก่อน — แก้ให้ถูกแล้วกด "ตรวจแล้ว" · ไม่ควรขาย ให้กด "ปิดรายการ" (บิลเดิมไม่หาย)</div>' + (ls.length ? ls.map(function (x, i) {
      return '<div class="card stack" data-ni="' + i + '"><div class="row"><b class="sp">' + esc(x.name) + '</b><span class="pill">' + esc(x.code) + '</span></div>' +
        '<div class="small muted">' + esc([x.category, x.type, x.performer !== '-' ? 'ทำโดย' + x.performer : 'ขายของ', x.sessions ? x.sessions + ' ครั้ง' : ''].filter(Boolean).join(' · ')) + ' · ราคา ' + esc(x.prices.join(' / ')) + '</div>' +
        '<div class="small muted">เพิ่มโดย ' + esc(x.addedBy) + ' ' + esc(x.addedAt) + ' · ขายไปแล้ว ' + x.sold + ' ครั้ง' + (x.bom.length ? ' · ใช้ ' + esc(x.bom.join(', ')) : '') + '</div>' +
        '<div class="g3"><label>ชื่อ<input data-k="name" value="' + esc(x.name) + '"></label><label>DF แพทย์ %<input data-k="dfPct" type="number" inputmode="decimal" value="' + esc(x.dfPct) + '"></label><label>ค่ามือ (บาท/ครั้ง)<input data-k="staffFee" type="number" inputmode="decimal" value="' + esc(x.staffFee) + '"></label></div>' +
        '<div class="row"><button class="btn d" data-a="niOff" data-i="' + i + '">ปิดรายการ</button><button class="btn p" data-a="niOk" data-i="' + i + '">ตรวจแล้ว</button></div></div>';
    }).join('') : '<div class="card empty">ไม่มีรายการรอตรวจ</div>') + '<p class="xs muted">ถ้าจะให้ขายสาขาอื่นด้วย ใส่ราคาในชีต Items ช่องของสาขานั้น</p></div>';
  });
};
function niVals(i) { var c = $('[data-ni="' + i + '"]'), o = {}; $$('[data-k]', c).forEach(function (el) { o[el.dataset.k] = el.value.trim(); }); return o; }
ACT.niOk = function (el) { var x = S.v.ni[+el.dataset.i], v = niVals(el.dataset.i); call('itemReview', { code: x.code, name: v.name, dfPct: v.dfPct, staffFee: v.staffFee }, { write: true }).then(function () { toast('บันทึกแล้ว'); refresh(); }).catch(fail); };
ACT.niOff = function (el) { var x = S.v.ni[+el.dataset.i]; ask('ปิดรายการ ' + x.name, 'ปุ่มนี้จะหายจากหน้าขาย บิลที่ขายไปแล้วไม่เปลี่ยน', 'ปิดรายการ', true).then(function (ok) { if (ok) call('itemReview', { code: x.code, disable: true }, { write: true }).then(function () { toast('ปิดแล้ว'); refresh(); }).catch(fail); }); };

/* ---------- เข้า-ออกงานพนักงาน ---------- */
TITLES.att = 'เข้า-ออกงานพนักงาน';
var ATT_ST = { IN: ['g', 'อยู่ในงาน'], OUT: ['', 'ออกแล้ว'], NOTYET: ['', 'ยังไม่ถึงเวลา'], MISSING: ['d', 'ยังไม่เช็คอิน'], ABSENT: ['d', 'ไม่มา'], NOSHIFT: ['', 'ไม่ได้ตั้งกะ'], OFF: ['', 'วันหยุด'] };
SCR.att = function (o) {
  o = o || S.v.at || { from: today(), to: today(), scope: 'ALL' }; S.v.at = o;
  return call('attReport', o).then(function (r) {
    S.v.ar = r; var all = has(['account', 'owner']);
    var sc = all ? '<select id="atsc" style="width:auto">' + opts([['ALL', 'ทุกสาขา']].concat(S.boot.branches.map(function (b) { return [b.code, b.name]; })), o.scope || 'ALL') + '</select>' : '';
    var board = r.board ? '<div class="card stack"><div class="sec"><h2>วันนี้ ' + esc(hmNow()) + '</h2><span class="pill">' + r.board.filter(function (b) { return b.state === 'IN'; }).length + ' คนอยู่ในงาน</span></div><div class="tbl"><table><thead><tr><th>ชื่อ</th><th>สาขา</th><th>กะ</th><th>สถานะ</th><th class="n">เข้า</th><th class="n">ออก</th><th class="n">ห่างร้าน</th></tr></thead><tbody>' +
      r.board.map(function (b) { var s = ATT_ST[b.state]; return '<tr><td>' + esc(b.nick) + '</td><td>' + esc(b.branch) + '</td><td class="small">' + esc(b.shift) + '</td><td><span class="pill ' + s[0] + '">' + s[1] + '</span>' + (b.late ? ' <span class="pill d">สาย ' + b.late + ' น.</span>' : '') + '</td><td class="n">' + esc(b.in) + '</td><td class="n">' + esc(b.out) + '</td><td class="n">' + (b.gps ? '<a href="' + esc(b.gps) + '" target="_blank" rel="noopener">' + esc(b.dist === '' ? 'แผนที่' : b.dist + ' ม.') + '</a>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div></div>' : '';
    var sum = '<div class="card stack"><div class="sec"><h2>สรุปรายคน</h2></div><div class="tbl"><table><thead><tr><th>ชื่อ</th><th>สาขา</th><th class="n">มา (วัน)</th><th class="n">สาย (ครั้ง)</th><th class="n">สายรวม (นาที)</th><th class="n">ลืมเช็คเอาท์</th><th class="n">ออกก่อนเวลา</th><th class="n">ชั่วโมงรวม</th></tr></thead><tbody>' +
      r.people.map(function (p) { return '<tr><td>' + esc(p.nick) + (p.partTime ? ' <span class="pill">PT</span>' : '') + '</td><td>' + esc(p.branch) + '</td><td class="n">' + p.days + '</td><td class="n">' + (p.late ? '<b class="dn">' + p.late + '</b>' : 0) + '</td><td class="n">' + p.lateMin + '</td><td class="n">' + (p.noOut ? '<b class="dn">' + p.noOut + '</b>' : 0) + '</td><td class="n">' + p.early + '</td><td class="n">' + fm(p.hours, 1) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    var det = '<div class="card stack"><div class="sec"><h2>รายวัน</h2><span class="pill">' + r.rows.length + '</span></div>' + (r.rows.length ? '<div class="tbl"><table><thead><tr><th>วันที่</th><th>ชื่อ</th><th>สาขา</th><th class="n">เข้า</th><th class="n">ออก</th><th class="n">ชม.</th><th></th><th>พิกัด</th>' + (r.canFix ? '<th></th>' : '') + '</tr></thead><tbody>' +
      r.rows.map(function (a, i) { return '<tr><td>' + esc(thDate(a.date, 1)) + '</td><td>' + esc(a.nick) + '</td><td>' + esc(a.branch) + '</td><td class="n">' + esc(a.in) + '</td><td class="n">' + esc(a.out || (a.date < today() ? '—' : '…')) + '</td><td class="n">' + (a.hours ? fm(a.hours, 1) : '') + '</td><td>' + (num0(a.late) ? '<span class="pill d">สาย ' + a.late + '</span> ' : '') + (!a.out && a.date < today() ? '<span class="pill w">ลืมออก</span> ' : '') + (a.early ? '<span class="pill w">ออกก่อน ' + a.early + ' น.</span> ' : '') + (/แก้โดย|เพิ่มย้อนหลัง/.test(a.note || '') ? '<span class="pill i" title="' + esc(a.note) + '">แก้แล้ว</span>' : '') + '</td><td class="small">' + (a.inGps ? '<a href="' + esc(a.inGps) + '" target="_blank" rel="noopener">เข้า' + (a.inDist !== '' ? ' ' + a.inDist + ' ม.' : '') + '</a>' : '') + (a.outGps ? ' · <a href="' + esc(a.outGps) + '" target="_blank" rel="noopener">ออก' + (a.outDist !== '' ? ' ' + a.outDist + ' ม.' : '') + '</a>' : '') + '</td>' + (r.canFix ? '<td><button class="btn sm" data-a="attFix" data-i="' + i + '">แก้</button></td>' : '') + '</tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">ยังไม่มีการลงเวลาในช่วงนี้</div>') + '</div>';
    return '<div class="stack">' + rangeBar(o, 'at') + '<div class="row">' + sc + '<span class="sp"></span>' + (r.canFix ? '<button class="btn" data-a="attAdd">+ เพิ่มวันที่ลืมเช็คอิน</button>' : '') + '<button class="btn" data-a="attExp">ส่งออก</button></div>' + board + sum + det +
      '<p class="xs muted">ลงเวลาผ่าน LINE OA เท่านั้น พร้อมพิกัด · สาย = เกินเวลาเข้ากะ ' + esc(String(S.boot.lateGrace || 5)) + ' นาทีขึ้นไป · ' + (r.canFix ? 'แก้ได้เฉพาะบัญชี ระบบเก็บเวลาเดิมและเหตุผลไว้ทุกครั้ง' : 'ถ้าต้องแก้เวลา แจ้งบัญชี') + '</p></div>';
  });
};
SCR.att.after = function () { var s = $('#atsc'); if (s) s.onchange = function () { S.v.at = Object.assign({}, S.v.at, { scope: s.value }); S.cur.arg = S.v.at; refresh(); }; };
function hmNow() { var d = new Date(Date.now() + 7 * 3600e3); return d.toISOString().slice(11, 16) + ' น.'; }
function num0(v) { return Number(v) || 0; }
ACT.attFix = function (el) { var a = S.v.ar.rows[+el.dataset.i];
  dialog({ title: 'แก้เวลา ' + a.nick + ' · ' + thDate(a.date), ok: 'บันทึก', body: '<div class="g2"><label>เข้า<input id="ai" type="time" value="' + esc(a.in) + '"></label><label>ออก<input id="ao" type="time" value="' + esc(a.out || '') + '"></label></div><label>เหตุผล *<input id="aw" placeholder="เช่น ลืมเช็คเอาท์ ผจก.ยืนยันออก 20:00"></label>',
    onOk: function (b) { return call('attFix', { id: a.id, in: b.querySelector('#ai').value, out: b.querySelector('#ao').value, reason: need(b.querySelector('#aw').value.trim(), 'ใส่เหตุผล') }, { write: true }).then(function () { toast('แก้แล้ว'); refresh(); }); } }); };
ACT.attAdd = function () { var ps = S.v.ar.people;
  dialog({ title: 'เพิ่มวันที่ลืมเช็คอิน', ok: 'บันทึก', body: '<label>พนักงาน<select id="as">' + opts(ps.map(function (p) { return [p.code, p.nick + ' (' + p.branch + ')']; }), '', '— เลือก —') + '</select></label><div class="g3"><label>วันที่<input id="ad" type="date" value="' + today() + '"></label><label>เข้า<input id="ai" type="time"></label><label>ออก<input id="ao" type="time"></label></div><label>เหตุผล *<input id="aw"></label>',
    onOk: function (b) { var g = function (s) { return b.querySelector(s).value.trim(); }; return call('attFix', { staff: need(g('#as'), 'เลือกพนักงาน'), date: g('#ad'), in: need(g('#ai'), 'ใส่เวลาเข้า'), out: g('#ao'), reason: need(g('#aw'), 'ใส่เหตุผล') }, { write: true }).then(function () { toast('เพิ่มแล้ว'); refresh(); }); } }); };
ACT.attExp = function () { var r = S.v.ar; saveText('เข้าออกงาน-' + r.from + '_' + r.to, toCsv([['วันที่', 'รหัส', 'ชื่อ', 'สาขา', 'เข้า', 'ออก', 'ชั่วโมง', 'สาย (นาที)', 'ห่างร้านตอนเข้า (ม.)', 'พิกัดเข้า', 'พิกัดออก', 'หมายเหตุ']].concat(r.rows.map(function (a) { return [a.date, a.staff, a.nick, a.branch, a.in, a.out, a.hours, a.late, a.inDist, a.inGps, a.outGps, a.note]; })))); };

/* เริ่มระบบ */
(function () {
  var tok = LS.sget('hs_tok'), u = LS.sget('hs_user');
  if (tok && u && !DEMO) { S.token = tok; S.user = JSON.parse(u); start(); return; }
  loginScreen(LS.get('hs_br', '') ? 'pin' : '');
})();
